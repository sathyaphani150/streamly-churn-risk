name: streamly-churn

services:
  api:
    image: streamly-churn:${STREAMLY_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      # The self-contained reviewer path uses the bundled immutable model.
      # Use a distinct variable so a host-level STREAMLY_ENV cannot accidentally
      # switch this container to production mode.
      STREAMLY_ENV: ${STREAMLY_COMPOSE_ENV:-dev}
    ports:
      - "127.0.0.1:${STREAMLY_API_PORT:-8000}:8000"
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    stop_grace_period: 10s

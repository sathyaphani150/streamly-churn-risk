# Parameters for DVC Pipeline Stages and Experiments
prepare:
  test_size: 0.20
  random_state: 42

train:
  model_type: "logistic_regression"
  random_state: 42
  # Logistic Regression parameters
  max_iter: 1000
  solver: lbfgs
  # Gradient Boosting parameters
  learning_rate: 0.05
  max_depth: 4
  # Random Forest parameters
  n_estimators: 100
  min_samples_leaf: 10

evaluate:
  threshold: 0.50
  target_recall: 0.60

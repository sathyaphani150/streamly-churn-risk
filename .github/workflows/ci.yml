name: Streamly MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate-and-tests:
    name: Code Hygiene, Contracts & Test Suite
    runs-on: ubuntu-latest
    env:
      STREAMLY_ENV: ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.1"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Locked Dependencies
        run: uv sync --extra dev --frozen

      - name: 1. Run Shared Local and CI Verification
        run: uv run python scripts/verify.py

      - name: 2. MLflow Experiment Tracking & Gated Challenger Registration
        run: |
          uv run python -m streamly.tracking.experiment --run-name ci_candidate
          RUN_ID=$(uv run python -c "import mlflow; mlflow.set_tracking_uri('sqlite:///mlruns.db'); print(mlflow.search_runs(experiment_names=['streamly-churn-risk'])['run_id'].iloc[0])")
          uv run python -m streamly.tracking.promotion --run-id $RUN_ID --alias challenger

      - name: 3. Archive Test Reports and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            coverage.xml
            junit-report.xml
            metrics.json
          retention-days: 14

  container-build-check:
    name: Multi-stage Docker Build Verification
    runs-on: ubuntu-latest
    needs: quality-gate-and-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Container Image
        run: |
          docker build --progress=plain -t streamly-churn:ci-test . 2>&1 | tee docker-build.log

      - name: Record Immutable Image Identity
        run: |
          mkdir -p reports/security
          docker image inspect --format='{{.Id}}' streamly-churn:ci-test > reports/security/image-id.txt

      - name: Generate SPDX-JSON Software Bill of Materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: streamly-churn:ci-test
          format: spdx-json
          output-file: reports/security/sbom.spdx.json
          syft-version: v1.54.1
          upload-artifact: false

      - name: Verify Non-Root Container Health and Scoring
        run: |
          docker run -d --name streamly-svc -e STREAMLY_ENV=ci -p 8080:8000 streamly-churn:ci-test
          curl --retry 15 --retry-delay 2 --retry-all-errors --fail \
            http://127.0.0.1:8080/health
          test "$(docker exec streamly-svc id -u)" = "10001"
          curl --fail --output score-response.json \
            --header "Content-Type: application/json" \
            --data '{"member_id":"ci_member","tenure_days":180,"sessions_7d":5,"watch_hours_7d":12.5,"support_tickets_30d":1,"plan_tier":"standard","price_increase_flag":0}' \
            http://127.0.0.1:8080/score
          python -c "import json; result=json.load(open('score-response.json')); assert 0 <= result['churn_risk'] <= 1; assert result['model_version']"
          cat score-response.json

      - name: Block Fixable High and Critical Vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: streamly-churn:ci-test
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: reports/security/trivy-report.json
          version: v0.75.0
          cache: true
          hide-progress: true

      - name: Dump Docker Build Log on Failure
        if: failure()
        run: |
          echo "=== DOCKER BUILD LOG DUMP ==="
          cat docker-build.log || true
          docker logs streamly-svc || true

      - name: Archive Container Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security-evidence
          path: |
            docker-build.log
            reports/security/image-id.txt
            reports/security/sbom.spdx.json
            reports/security/trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Clean Up Test Container
        if: always()
        run: docker rm -f streamly-svc || true

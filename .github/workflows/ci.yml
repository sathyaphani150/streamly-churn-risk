name: Streamly MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate-and-tests:
    name: Code Hygiene, Contracts & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.1"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Locked Dependencies
        run: uv sync --extra dev --frozen

      - name: 1. Code Linting & Style Check (Ruff)
        run: uv run ruff check .

      - name: 2. Strict Static Type Analysis (Mypy)
        run: uv run mypy src tests

      - name: 3. Materialize Sample Dataset for CI Validation
        run: uv run python -m streamly.data.make_dataset

      - name: 4. Schema & Data Contract Quality Gate
        run: uv run python -m streamly.data.validation --data-path data/raw/streamly_churn_sample.parquet --mode train

      - name: 5. Execute Reproducible DVC Pipeline
        run: |
          uv run dvc repro
          uv run dvc status

      - name: 6. MLflow Experiment Tracking & Gated Challenger Registration
        run: |
          uv run python -m streamly.tracking.experiment --run-name ci_candidate
          RUN_ID=$(uv run python -c "import mlflow; mlflow.set_tracking_uri('sqlite:///mlruns.db'); print(mlflow.search_runs(experiment_names=['streamly-churn-risk'])['run_id'].iloc[0])")
          uv run python -m streamly.tracking.promotion --run-id $RUN_ID --alias challenger

      - name: 7. Execute Unit & Integration Test Suite
        run: |
          uv run pytest --cov=streamly --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=junit-report.xml

      - name: 8. Archive Test Reports and Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            coverage.xml
            junit-report.xml
            metrics.json
          retention-days: 14

  container-build-check:
    name: Multi-stage Docker Build Verification
    runs-on: ubuntu-latest
    needs: quality-gate-and-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Production Container Image
        run: |
          docker build --progress=plain -t streamly-churn:ci-test . 2>&1 | tee docker-build.log

      - name: Verify Non-Root Container Health and Scoring
        run: |
          docker run -d --name streamly-svc -p 8080:8000 streamly-churn:ci-test
          curl --retry 10 --retry-delay 2 --retry-connrefused -f http://127.0.0.1:8080/health
          test "$(docker exec streamly-svc id -u)" = "10001"
          curl --fail --output score-response.json \
            --header "Content-Type: application/json" \
            --data '{"member_id":"ci_member","tenure_days":180,"sessions_7d":5,"watch_hours_7d":12.5,"support_tickets_30d":1,"plan_tier":"standard","price_increase_flag":0}' \
            http://127.0.0.1:8080/score
          python -c "import json; result=json.load(open('score-response.json')); assert 0 <= result['churn_risk'] <= 1; assert result['model_version']"
          cat score-response.json

      - name: Dump Docker Build Log on Failure
        if: failure()
        run: |
          echo "=== DOCKER BUILD LOG DUMP ==="
          cat docker-build.log || true
          docker logs streamly-svc || true

      - name: Clean Up Test Container
        if: always()
        run: docker rm -f streamly-svc || true
